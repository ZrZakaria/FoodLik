plugins {
    id "com.android.application"
}

android {
    namespace "ma.ensa.foodlik"
    compileSdk 35

    def releaseStoreFile = project.findProperty("FOODLIK_RELEASE_STORE_FILE") ?: System.getenv("FOODLIK_RELEASE_STORE_FILE")
    def releaseStorePassword = project.findProperty("FOODLIK_RELEASE_STORE_PASSWORD") ?: System.getenv("FOODLIK_RELEASE_STORE_PASSWORD")
    def releaseKeyAlias = project.findProperty("FOODLIK_RELEASE_KEY_ALIAS") ?: System.getenv("FOODLIK_RELEASE_KEY_ALIAS")
    def releaseKeyPassword = project.findProperty("FOODLIK_RELEASE_KEY_PASSWORD") ?: System.getenv("FOODLIK_RELEASE_KEY_PASSWORD")
    def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
            .every { it != null && it.toString().trim().length() > 0 }

    defaultConfig {
        applicationId "ma.ensa.foodlik"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "0.1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "DEFAULT_API_BASE_URL", "\"https://foodlik.local/\""
    }

    signingConfigs {
        classroomRelease {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            buildConfigField "boolean", "DEBUG_LOGGING", "true"
        }
        release {
            minifyEnabled false
            signingConfig hasReleaseSigning ? signingConfigs.classroomRelease : signingConfigs.debug
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField "boolean", "DEBUG_LOGGING", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.fragment:fragment:1.8.5"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    implementation "com.google.android.material:material:1.14.0"
    implementation "com.google.android.gms:play-services-maps:20.0.0"
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-gson:3.0.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    
    // Image loading
    implementation "com.github.bumptech.glide:glide:4.16.0"

    testImplementation "junit:junit:4.13.2"
}
